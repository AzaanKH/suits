name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, format
    runs-on: ubuntu-latest
    steps:
      # Git LFS: the geometry test reads the shipped 3D models.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The storefront reads its catalog from Convex. Add the repository secret
    # NEXT_PUBLIC_CONVEX_URL (a seeded deployment) to turn this job on; Clerk
    # keys are optional. Forked PRs never receive secrets, so they skip it.
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Check for a Convex deployment
        id: gate
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::notice::NEXT_PUBLIC_CONVEX_URL is not set; skipping end-to-end tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The 3D models and textures are Git LFS objects; without them the
      # studio loads pointer files and its tests fail.
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: pnpm test:e2e
        env:
          CI: true
      - if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
